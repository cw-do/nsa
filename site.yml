# Site-wide settings. Edit, commit and push: the site rebuilds itself in about a minute.

name: Neutrons, Soft Matters and Algorithms
short_name: NSA
url: https://cw-do.github.io/nsa
founded: 2025

# One sentence for search engines and link previews.
description: >-
  An international working group where neutron scattering, soft matter and the
  mathematics of data analysis meet. Home of The Long View, a seminar series of
  conversations in soft matter.

# The big staggered title on the home page, one line each.
hero_lines:
  - Neutrons,
  - Soft Matters,
  - and Algorithms

# The hero paragraph on the home page.
lead: >-
  A working group for scientists who study soft materials with neutrons and
  reason about the data with mathematics, statistical mechanics and AI. We meet
  online, and anyone working where these fields cross is welcome.

# Meeting times in content/ are read in this time zone unless a file says otherwise.
timezone: America/New_York
timezone_city: Knoxville

# How a meeting runs (agreed at the kick-off meeting, 8 April 2025).
meeting_format:
  - title: Introduction
    text: The host introduces the speaker and the question.
  - title: Presentation
    text: An open topic, chosen by the speaker.
  - title: Discussion
    text: Led by the host, with everyone on the call. About an hour and a half in all.

organizers:
